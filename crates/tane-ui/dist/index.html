<!DOCTYPE html>

    <!-- Detect theme before CSS loads — prevents flash of wrong theme.
         Reads tane-theme from localStorage (light|dark|system).
         Migrates old theme-preference key if present. -->
    <script>
        (function() {
            var d = document.documentElement;
            try {
                var stored = localStorage.getItem('tane-theme');
                if (!stored) {
                    stored = localStorage.getItem('theme-preference');
                    if (stored) {
                        localStorage.setItem('tane-theme', stored);
                        localStorage.removeItem('theme-preference');
                    }
                }
                var isDark;
                if (stored === 'dark') {
                    isDark = true;
                } else if (stored === 'light') {
                    isDark = false;
                } else {
                    isDark = matchMedia('(prefers-color-scheme:dark)').matches;
                }
                if (isDark) d.classList.add('dark');
                else d.classList.remove('dark');
            } catch(e) {}
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Loading screen styles — inlined so they render before any external CSS -->
    <style>
        .tane-loading {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--color-background, #ffffff);
            z-index: 99999;
            transition: opacity 0.3s ease;
        }
        .dark .tane-loading {
            background: var(--color-background, #12100F);
        }
        .tane-loading svg {
            width: 40px;
            height: 40px;
        }

        /* SSR hydration gap — disable buttons and show progress bar until
           WASM removes the data-ssr attribute from <body>. Inputs stay
           enabled (typing works without JS). Links stay clickable. */
        body[data-ssr] button {
            pointer-events: none;
            opacity: 0.5;
        }
        /* Progress bar via pseudo-element so no DOM node is injected into
           <body> — a real element would break Leptos hydration (DOM/vdom
           mismatch). The ::before disappears automatically when data-ssr
           is removed from <body>. */
        body[data-ssr]::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            height: 2px;
            background: var(--color-primary, #4f46e5);
            z-index: 99999;
            animation: ssr-bar 2.5s ease-out forwards;
        }
        @keyframes ssr-bar {
            0%   { width: 0; }
            100% { width: 90%; }
        }
    </style>

    <script type="module">
        // Ensure auth session is fresh before WASM boots.
        // Access tokens expire after 15 min — refresh to get a new one.
        await fetch('/api/v1/auth/refresh', { method: 'POST', credentials: 'same-origin' }).catch(() => {});
    </script>
