[package]
name = "trakkt-ui"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[features]
default = []
# Server-side rendering — includes leptos_axum, accesses DB/services directly
ssr = [
    "leptos/ssr",
    "dep:leptos_axum",
    "leptos_router/ssr",
    "leptos_meta/ssr",
    "dep:trakkt-core",
    "dep:trakkt-auth",
    "dep:trakkt-api",
    "dep:trakkt-github",
    "dep:tokio",
    "dep:uuid",
    "dep:axum",
    "dep:sqlx",
    "dep:webauthn-rs",
]
# Client-side hydration — compiles to WASM, no server deps
hydrate = [
    "leptos/hydrate",
    "leptos/csr",
]

[dependencies]
# Leptos framework
leptos = "0.8"
leptos_router = "0.8"
leptos_meta = "0.8"
leptos_axum = { version = "0.8", optional = true }

# Serialization (shared types cross server/client boundary)
serde = { workspace = true }
serde_json = { workspace = true }
trakkt-types = { workspace = true }

# WASM error handling (client-only, but always compiled — no-op on server)
console_error_panic_hook = "0.1"

# Icons
phosphor-leptos = "0.8"

# WYSIWYG markdown editor (client-side only, compiles to WASM)
kode-leptos = "0.5"

# Browser DOM access
web-sys = { version = "0.3", features = [
    "Window", "Document", "HtmlElement", "HtmlInputElement",
    "Element", "EventTarget", "Node",
    "KeyboardEvent", "DomTokenList", "MediaQueryList", "Location",
    "Navigator", "Storage",
    "CredentialsContainer", "Credential", "PublicKeyCredential",
    "AuthenticatorResponse", "AuthenticatorAttestationResponse",
    "AuthenticatorAssertionResponse",
    "CredentialCreationOptions", "CredentialRequestOptions",
    "Clipboard", "History", "HtmlDivElement", "DomRect",
    "ScrollIntoViewOptions", "ScrollLogicalPosition", "ScrollBehavior",
    "WebSocket", "MessageEvent", "CloseEvent",
    # Cross-tab sync coordination (cache/tab_leader.rs). The Web Locks half of
    # that module is hand-bound, not listed here: web-sys puts Lock/LockManager
    # behind --cfg=web_sys_unstable_apis, which cannot be enabled workspace-wide
    # without breaking the kode-leptos dependency. See cache/tab_leader.rs.
    "BroadcastChannel",
    "FormData", "File", "FileList", "Blob", "BlobPropertyBag",
    "Headers", "Request", "RequestInit", "RequestCredentials", "Response",
] }

# Timers for WASM
gloo-timers = { version = "0.3", features = ["futures"] }

# Channels for the single-writer IndexedDB queue (cache/idb_writer.rs)
futures = { workspace = true }

# SendWrapper for non-Send JS values in Leptos reactive closures
send_wrapper = "0.6"

# IndexedDB persistence for client-side sync cache (WASM only, no-op on server)
indexed_db_futures = { version = "0.6", features = ["serde"] }

# WASM interop
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

# Base64 encoding
base64 = { workspace = true }

# Regex for auto-linking issue identifiers
regex = { workspace = true }

# URL encoding/decoding (for persisting filters in query params)
percent-encoding = { workspace = true }

# Logging
tracing = { workspace = true }

# Date/time
chrono = { workspace = true, features = ["wasmbind"] }

# Internal crates (server-only — gated behind ssr feature)
trakkt-core = { workspace = true, optional = true }
trakkt-auth = { workspace = true, optional = true }
trakkt-api = { workspace = true, optional = true }
trakkt-github = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
webauthn-rs = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

# Server-side test dependencies. Target-gated because `cargo build --tests`
# for wasm32 (wasm-pack test) would otherwise try to compile these native-only
# crates — sqlx, tokio and getrandom do not build for wasm32-unknown-unknown.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
trakkt-core = { workspace = true, features = ["test-helpers"] }
trakkt-auth = { workspace = true }
tokio = { workspace = true }

# Browser-hosted tests for the IndexedDB writer.
# Run: wasm-pack test --headless --firefox crates/trakkt-ui --lib --features hydrate
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
# Leptos spawns through this — `Effect`, `Resource` and `LocalResource` all do,
# on construction — and boots it from `mount_to_body` / `hydrate_body`, neither
# of which a `wasm-bindgen-test` runs. Tests that spawn before they mount have to
# initialise it themselves; see `src/wasm_test_support.rs`. Already in the lock
# file as a transitive dependency of leptos, and pinned to the same version.
any_spawner = "0.3"
