# Trunk build configuration for trakkt-ui
# https://trunkrs.dev/configuration/

[build]
# Output directory for trunk build artifacts
dist = "dist"
# Use wasm-dev profile by default (lto=false, cgu=16, opt-level=s): saves ~5 min
# per incremental build at the cost of ~1.4 MB extra brotli. Override with
# --release for production artifacts (uses the release profile instead).
cargo_profile = "wasm-dev"

[[hooks]]
# Run Tailwind CSS build before trunk processes assets.
# Scans .rs source files for Tailwind class names and produces compiled CSS.
stage = "pre_build"
command = "tailwindcss"
command_arguments = [
    "--input", "style/main.css",
    "--output", "style/output.css",
]

[tools]
wasm_opt = "version_128"

