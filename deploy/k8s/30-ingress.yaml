apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: trakkt
  namespace: trakkt
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`trakkt.app`)
      services:
        - name: trakkt
          port: 80
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: docs-trailing-slash
  namespace: trakkt
spec:
  redirectRegex:
    regex: "^(https?://[^/]+/docs)$"
    replacement: "${1}/"
    permanent: false
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-docs-prefix
  namespace: trakkt
spec:
  stripPrefix:
    prefixes:
      - /docs
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: trakkt-docs
  namespace: trakkt
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`trakkt.app`) && PathPrefix(`/docs`)
      priority: 100
      middlewares:
        - name: docs-trailing-slash
        - name: strip-docs-prefix
      services:
        - name: trakkt-docs
          port: 80
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-docs-subdomain
  namespace: trakkt
spec:
  redirectRegex:
    regex: "^https?://docs\\.trakkt\\.app(.*)"
    replacement: "https://trakkt.app/docs${1}"
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: trakkt-docs-subdomain-redirect
  namespace: trakkt
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`docs.trakkt.app`)
      middlewares:
        - name: redirect-docs-subdomain
      services:
        - name: trakkt-docs
          port: 80
