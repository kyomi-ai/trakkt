apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: trakkt
  namespace: trakkt
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`trakkt.app`)
      services:
        - name: trakkt
          port: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: trakkt-docs
  namespace: trakkt
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`docs.trakkt.app`)
      services:
        - name: trakkt-docs
          port: 80
