apiVersion: v1
kind: ConfigMap
metadata:
  name: trakkt-config
  namespace: trakkt
data:
  # Deployment mode: personal, self_hosted, or saas
  trakkt-mode: "saas"

  # Database configuration
  db-host: "postgres.trakkt.svc.cluster.local"
  db-port: "5432"
  db-name: "trakkt"

  # Redis configuration
  redis-host: "redis.trakkt.svc.cluster.local"
  redis-port: "6379"

  # Server configuration
  port: "8003"

  # URLs
  base-url: "https://trakkt.app"
  frontend-url: "https://trakkt.app"

  # WebAuthn RP configuration
  webauthn-rp-id: "trakkt.app"
  webauthn-rp-name: "Trakkt"

  # SMTP (AWS SES)
  smtp-host: "email-smtp.us-west-2.amazonaws.com"
  smtp-port: "465"
  smtp-from-email: "noreply@trakkt.app"
  smtp-from-name: "Trakkt"

  # Support email
  support-email: "support@trakkt.app"

  # Logging
  rust-log: "info"
