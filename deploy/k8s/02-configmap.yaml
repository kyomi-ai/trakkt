apiVersion: v1
kind: ConfigMap
metadata:
  name: trakkt-config
  namespace: trakkt
data:
  # Deployment mode: personal, self_hosted, or saas
  trakkt-mode: "self_hosted"

  # Database configuration
  db-host: "postgres.trakkt.svc.cluster.local"
  db-port: "5432"
  db-name: "trakkt"

  # Redis configuration
  redis-host: "redis.trakkt.svc.cluster.local"
  redis-port: "6379"

  # Server configuration
  port: "8003"

  # URLs (adjust for your cluster)
  base-url: "http://trakkt.local"
  frontend-url: "http://trakkt.local"

  # WebAuthn RP configuration
  webauthn-rp-id: "trakkt.local"
  webauthn-rp-name: "Trakkt"

  # Support email
  support-email: "support@trakkt.local"

  # Logging
  rust-log: "info"
