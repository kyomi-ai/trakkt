# Example secrets for self-hosted Trakkt deployments.
# Copy this file to 01-secrets.yaml and fill in real values before applying.
#
# For SaaS/cloud deployments, secrets are managed separately
# in the trakkt-cloud repository using Sealed Secrets.
#
# Generate secure values:
#   openssl rand -base64 32    # for jwt-secret-key, encryption-key
#   openssl rand -base64 16    # for db-password
apiVersion: v1
kind: Secret
metadata:
  name: trakkt-secrets
  namespace: trakkt
type: Opaque
stringData:
  jwt-secret-key: "CHANGE-ME-generate-with-openssl-rand-base64-32"
  encryption-key: "CHANGE-ME-generate-with-openssl-rand-base64-32"
  db-password: "CHANGE-ME-generate-with-openssl-rand-base64-16"
  db-user: "trakkt"

  # SMTP credentials (optional — only needed if email is configured)
  smtp-user: "CHANGE-ME-smtp-username"
  smtp-password: "CHANGE-ME-smtp-password"
