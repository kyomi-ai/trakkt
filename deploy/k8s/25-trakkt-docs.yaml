apiVersion: v1
kind: Service
metadata:
  name: trakkt-docs
  namespace: trakkt
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
  selector:
    app: trakkt-docs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trakkt-docs
  namespace: trakkt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trakkt-docs
  template:
    metadata:
      labels:
        app: trakkt-docs
    spec:
      containers:
        - name: trakkt-docs
          image: ghcr.io/kyomi-ai/trakkt-docs:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /index.html
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /index.html
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "50m"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 101
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
