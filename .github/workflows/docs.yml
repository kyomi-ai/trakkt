# =============================================================================
# Trakkt — Docs Site Build & Deploy
# =============================================================================
# Triggered on pushes to main that touch documentation sources, or manually
# via workflow_dispatch. Generates API reference docs, builds the mdBook,
# packages the result into a Docker image (nginx), pushes to GHCR, and
# dispatches a deploy event to trakkt-cloud.
#
# Usage:
#   Push changes to docs/book/, tools/gen-api-docs/, or the OpenAPI spec.
#   Or trigger manually from the Actions tab.
# =============================================================================

name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/book/**'
      - 'tools/gen-api-docs/**'
      - 'crates/trakkt-api/src/openapi.rs'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  GHCR_REGISTRY: ghcr.io/kyomi-ai

jobs:
  # ---------------------------------------------------------------------------
  # Build docs and push Docker image to GHCR
  # ---------------------------------------------------------------------------
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.docs
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.GHCR_REGISTRY }}/trakkt-docs:${{ github.sha }}
            ${{ env.GHCR_REGISTRY }}/trakkt-docs:latest
          cache-from: type=gha,scope=docs
          cache-to: type=gha,mode=max,scope=docs

  # ---------------------------------------------------------------------------
  # Deploy: notify trakkt-cloud to deploy from GHCR
  # ---------------------------------------------------------------------------
  deploy-notify:
    name: Deploy Notify
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.ARC_APP_ID }}
          private-key: ${{ secrets.ARC_APP_PRIVATE_KEY }}
          owner: kyomi-ai
          repositories: trakkt-cloud

      - name: Dispatch deploy to trakkt-cloud
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: kyomi-ai/trakkt-cloud
          event-type: public-repo-updated
          client-payload: >-
            {
              "component": "docs",
              "version": "${{ github.sha }}",
              "sha": "${{ github.sha }}"
            }
