# =============================================================================
# Trakkt — Docs Site Build & Deploy
# =============================================================================
# Triggered on pushes to main that touch documentation sources, or manually
# via workflow_dispatch. Generates API reference docs, builds the mdBook,
# packages the result into a Docker image (nginx), pushes to GHCR, and
# dispatches a deploy event to trakkt-cloud.
#
# Usage:
#   Push changes to docs/book/, tools/gen-api-docs/, or the OpenAPI spec.
#   Or trigger manually from the Actions tab.
# =============================================================================

name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/book/**'
      - 'tools/gen-api-docs/**'
      - 'crates/trakkt-api/src/openapi.rs'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  GHCR_REGISTRY: ghcr.io/kyomi-ai

jobs:
  # ---------------------------------------------------------------------------
  # Build docs and push Docker image to GHCR
  # ---------------------------------------------------------------------------
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    # Measured at 241-324s (4m1s-5m24s) across the 8 most recent runs, job-level
    # started_at -> completed_at. As with release.yml's `docker`, that is
    # already a from-scratch compile: Dockerfile.docs runs `COPY . .` before
    # `cargo run -p gen-api-docs`, so every run this workflow's path filter lets
    # through rebuilds it cold, and the GHA cache only serves the apt and
    # mdbook-download layers above the COPY. Realistic worst is those preamble
    # layers missing plus a slow runner plus a slow crates.io — roughly 10min,
    # which 15 covers with ~1.5x headroom, the same ratio ci.yml's `Test Suite`
    # is sized at. Against the observed maximum it is ~2.8x. Well under
    # release.yml's `docker` because the build is far smaller: one helper binary
    # and an mdBook, not the server binary plus the WASM frontend.
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.docs
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.GHCR_REGISTRY }}/trakkt-docs:${{ github.sha }}
            ${{ env.GHCR_REGISTRY }}/trakkt-docs:latest
          cache-from: type=gha,scope=docs
          cache-to: type=gha,mode=max,scope=docs

  # ---------------------------------------------------------------------------
  # Deploy: notify trakkt-cloud to deploy from GHCR
  # ---------------------------------------------------------------------------
  deploy-notify:
    name: Deploy Notify
    needs: [build]
    runs-on: ubuntu-latest
    # Step-for-step identical to release.yml's `deploy-notify`, and measures the
    # same: 4-7s across the 8 most recent runs. Floor rather than a multiple,
    # for the reason recorded on release.yml's `prepare`.
    timeout-minutes: 5
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.ARC_APP_ID }}
          private-key: ${{ secrets.ARC_APP_PRIVATE_KEY }}
          owner: kyomi-ai
          repositories: trakkt-cloud

      - name: Dispatch deploy to trakkt-cloud
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: kyomi-ai/trakkt-cloud
          event-type: public-repo-updated
          client-payload: >-
            {
              "component": "docs",
              "version": "${{ github.sha }}",
              "sha": "${{ github.sha }}"
            }
