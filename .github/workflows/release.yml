# =============================================================================
# Trakkt — Release Workflow
# =============================================================================
# Triggered by version tags (v*). Builds a linux/amd64 Docker image via
# Dockerfile.ci, pushes to GHCR, dispatches a deploy to trakkt-cloud,
# and creates a GitHub Release.
#
# Usage:
#   git tag v2026.05.11.1
#   git push --tags
# =============================================================================

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  GHCR_REGISTRY: ghcr.io/kyomi-ai

jobs:
  # ---------------------------------------------------------------------------
  # Extract version from tag
  # ---------------------------------------------------------------------------
  prepare:
    runs-on: ubuntu-latest
    # One `echo` into $GITHUB_OUTPUT — no checkout, no network, no build.
    # Measured at 2-4s across the 12 most recent releases (job-level
    # started_at -> completed_at). There is no worst case to size against, so
    # this is a floor rather than a multiple of anything: 5 is the smallest
    # bound that cannot plausibly fire on a slow-runner day (~75x the observed
    # maximum), matching the floor ci.yml's `tx-pool` job already uses for the
    # same reason. A tighter number would buy nothing and would risk a spurious
    # red, which is worse than no bound because it teaches people to ignore the
    # colour.
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

  # ---------------------------------------------------------------------------
  # Docker: build and push image via Dockerfile.ci
  # ---------------------------------------------------------------------------
  docker:
    needs: [prepare]
    runs-on: ubuntu-latest
    # The job whose silent failure motivates this bound: `deploy-notify` and
    # `release` both need it, so when it hangs the deploy never happens and
    # nothing turns red until someone asks why the release did not ship.
    #
    # Measured at 965-1149s (16m5s-19m9s) across the 12 most recent releases — a
    # tight band, and that band is already the from-scratch build cost.
    # Dockerfile.ci runs `COPY . .` before `trunk build --release` and
    # `cargo build --release`, so any source change invalidates that layer and
    # both compiles run cold on every release; `cache-from: type=gha` can only
    # serve the layers above the COPY (apt, `rustup target add`, and the trunk /
    # wasm-bindgen / tailwindcss downloads). So unlike a job backed by a warm
    # dependency cache, there is no much-worse cold case hiding behind these
    # numbers. The remaining variance is a cache miss on those preamble layers,
    # a slow runner, a bad crates.io day, and the dependency graph growing over
    # time. 40 is ~2.1x the observed maximum, enough for all four at once, and
    # surfaces a wedged build in 40 minutes rather than the 6 hours it takes now.
    #
    # Deliberately not the 45 that claude-code-review.yml uses, despite the
    # similar observed maxima (19m9s here, 20m23s there): that job's headroom
    # covers open-ended variance in how long an LLM review runs, this one's
    # covers a bounded and well-understood compile. Equal numbers would be a
    # coincidence rather than a shared rationale.
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.ci
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.GHCR_REGISTRY }}/trakkt:${{ needs.prepare.outputs.version }}
            ${{ env.GHCR_REGISTRY }}/trakkt:latest
          cache-from: type=gha,scope=docker
          cache-to: type=gha,mode=max,scope=docker

  # ---------------------------------------------------------------------------
  # Deploy: notify trakkt-cloud to deploy from GHCR
  # ---------------------------------------------------------------------------
  deploy-notify:
    needs: [prepare, docker]
    runs-on: ubuntu-latest
    # Two GitHub API calls: mint an app token, then dispatch the event.
    # Measured at 3-7s across the 12 most recent releases. Sized as a floor
    # rather than a multiple, for the reason recorded on `prepare` above; 5 is
    # ~43x the observed maximum and gives a stalled API call somewhere to fail.
    timeout-minutes: 5
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.ARC_APP_ID }}
          private-key: ${{ secrets.ARC_APP_PRIVATE_KEY }}
          owner: kyomi-ai
          repositories: trakkt-cloud

      - name: Dispatch deploy to trakkt-cloud
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: kyomi-ai/trakkt-cloud
          event-type: public-repo-updated
          client-payload: >-
            {
              "version": "${{ github.ref_name }}",
              "sha": "${{ github.sha }}"
            }

  # ---------------------------------------------------------------------------
  # GitHub Release
  # ---------------------------------------------------------------------------
  release:
    needs: [prepare, docker]
    runs-on: ubuntu-latest
    # One API call, but `generate_release_notes: true` makes GitHub walk the
    # commit range since the previous tag, so this is the only short job here
    # whose cost grows with anything. Measured at 6-11s across the 12 most
    # recent releases; 5 is ~27x that and absorbs a far larger commit range than
    # any release so far has produced. Floor rather than a multiple — see
    # `prepare` above.
    timeout-minutes: 5
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body: |
            ## Installation

            ### Docker
            ```bash
            docker pull ghcr.io/kyomi-ai/trakkt:${{ needs.prepare.outputs.version }}
            ```

            Then run:
            ```bash
            docker run -p 8003:8003 \
              -e DATABASE_URL=postgres://user:pass@host/trakkt \
              -e JWT_SECRET_KEY=your-secret-key \
              -e ENCRYPTION_KEY=your-encryption-key \
              ghcr.io/kyomi-ai/trakkt:${{ needs.prepare.outputs.version }}
            ```

            ### Self-hosting

            Trakkt is a single binary with the frontend embedded. The Docker
            image exposes port **8003** and requires the following environment
            variables:

            | Variable | Description |
            |---|---|
            | `DATABASE_URL` | PostgreSQL connection string |
            | `JWT_SECRET_KEY` | Secret key for JWT token signing |
            | `ENCRYPTION_KEY` | Secret key for data encryption |
