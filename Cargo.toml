[workspace]
members = [
    "crates/trakkt-core",
    "crates/trakkt-auth",
    "crates/trakkt-types",
    "crates/trakkt-api",
    "crates/trakkt-github",
    "crates/trakkt-ui",
    "apps/server",
]
resolver = "3"

[workspace.package]
license = "AGPL-3.0-or-later"
repository = "https://github.com/kyomi-ai/trakkt"
homepage = "https://trakkt.app"
description = "Open-source issue tracker. Linear-quality UX, single binary, self-hostable."

# Shared dependency versions — all crates use these
[workspace.dependencies]
# Web framework
axum = { version = "0.8", features = ["ws", "multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "limit", "normalize-path", "set-header", "trace"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls-ring", "postgres", "sqlite", "mysql", "uuid", "chrono", "json", "macros", "rust_decimal", "migrate"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1", features = ["chrono04"] }

# Auth
jsonwebtoken = { version = "10", features = ["use_pem", "rust_crypto"] }
bcrypt = "0.17"
argon2 = "0.5"

# Encryption
aes-gcm = "0.10"
base64 = "0.22"

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
# Redis
redis = { version = "0.29", features = ["tokio-rustls-comp", "connection-manager"] }
# HTTP client (for external APIs: Anthropic, Stripe, Slack, etc.)
# Uses native-roots so reqwest trusts both public CAs and our internal CA
# (distributed via trust-manager's SSL_CERT_FILE bundle).

# WebAuthn (passkeys)
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation", "conditional-ui"] }
webauthn-rs-proto = "0.5"
# URL parsing
url = "2"

# Hashing
sha2 = "0.10"
# Random
rand = "0.9"

# Email
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "hostname", "builder", "pool"] }

# TOTP 2FA
totp-rs = { version = "5", features = ["otpauth", "gen_secret", "qr"] }

# Utilities
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"

# Internal crates
trakkt-core = { path = "crates/trakkt-core" }
trakkt-auth = { path = "crates/trakkt-auth" }
trakkt-ui = { path = "crates/trakkt-ui" }
trakkt-server = { path = "apps/server" }
trakkt-api = { path = "crates/trakkt-api" }
trakkt-types = { path = "crates/trakkt-types" }
trakkt-github = { path = "crates/trakkt-github" }
# Async trait
async-trait = "0.1"

# Concurrent data structures
dashmap = "6"

# Stream utilities (for Redis pub/sub)
futures-util = "0.3"

[workspace.lints.clippy]
unwrap_used = "warn"

# WASM debug builds: disable debug info to keep link input manageable.
# Without this, 17GB of debug symbols crashes rust-lld.
[profile.dev]
debug = false

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Fast incremental builds for local development: release optimizations without LTO.
[profile.dev-server]
inherits = "release"
lto = false
codegen-units = 16
debug-assertions = true

# Fast WASM builds for dev iteration. Saves ~5 min per incremental build vs release
# at a cost of ~1.4 MB extra brotli transfer. Use for dev.trakkt.app; use release for prod.
[profile.wasm-dev]
inherits = "release"
lto = false
codegen-units = 16
opt-level = "s"
# The Dockerfile strips everything between BEGIN_LOCAL_DEV_PATCHES and
# END_LOCAL_DEV_PATCHES before `cargo build`, so prod always uses crates.io.
# BEGIN_LOCAL_DEV_PATCHES
[patch.crates-io]
kode-leptos = { path = "../kode/kode-leptos" }
# END_LOCAL_DEV_PATCHES
