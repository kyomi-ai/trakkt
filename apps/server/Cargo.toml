[package]
name = "trakkt-server"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "trakkt"
path = "src/main.rs"

[dependencies]
trakkt-core = { workspace = true }
trakkt-auth = { workspace = true }
trakkt-api = { workspace = true }
trakkt-github = { workspace = true }
trakkt-types = { workspace = true }
trakkt-ui = { workspace = true, features = ["ssr"] }
leptos = "0.8"
leptos_axum = "0.8"
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
sqlx = { workspace = true }
redis = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
webauthn-rs = { workspace = true }
url = { workspace = true }
base64 = { workspace = true }
percent-encoding = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
futures-util = { workspace = true }
dashmap = { workspace = true }
async-trait = { workspace = true }
rust-embed = "8"
any_spawner = { version = "0.3", features = ["tokio"] }
tokio-tungstenite = { version = "0.28", default-features = false }
async-stripe-webhook = { workspace = true }
async-stripe-shared = { workspace = true }
async-stripe-types = { workspace = true }

[dev-dependencies]
trakkt-core = { workspace = true, features = ["test-helpers"] }
trakkt-auth = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
sqlx = { workspace = true }
uuid = { workspace = true }

[lints]
workspace = true
